name: Build versioned Beta packages
on:
  workflow_dispatch:
    inputs:
      graphics_diagnostics:
        description: Diagnose hosted Intel Mac graphics without packaging
        type: boolean
        default: false
      draft_source_run:
        description: Verify installers from a successful run and upload only to the existing unpublished draft
        type: string
        default: ''
      draft_release_id:
        description: Numeric ID of the existing draft for this version
        type: string
        default: ''
      macos_only:
        description: Build or stage only the Mac packages
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: beta-packages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  draft:
    if: ${{ inputs.draft_source_run != '' }}
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.macos_only && '["mac-arm64","mac-x64"]' || '["windows-x64","mac-arm64","mac-x64"]') }}
    runs-on: ${{ fromJSON('{"windows-x64":"windows-2025","mac-arm64":"macos-15","mac-x64":"macos-15-intel"}')[matrix.target] }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8.0.2
        with:
          name: beta-${{ matrix.target }}
          path: ${{ matrix.target == 'windows-x64' && 'release/beta' || 'release/macos' }}
          run-id: ${{ inputs.draft_source_run }}
          github-token: ${{ github.token }}
      - name: Mount and launch the real Mac installer
        if: runner.os == 'macOS'
        run: node scripts/verify-macos-installers.cjs
      - name: Upload verified files to the existing draft only
        run: node scripts/upload-draft-assets.cjs
        env:
          GH_TOKEN: ${{ github.token }}
          BAY_SOURCE_RUN: ${{ inputs.draft_source_run }}
          BAY_DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
  graphics:
    if: ${{ inputs.graphics_diagnostics }}
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: brew install vulkan-loader
      - run: node scripts/probe-macos-graphics.cjs
      - uses: actions/upload-artifact@v6
        with:
          name: macos-graphics-diagnostics
          path: macos-graphics-diagnostics.json
          retention-days: 7
  package:
    if: ${{ !inputs.graphics_diagnostics && inputs.draft_source_run == '' }}
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.macos_only && '["mac-arm64","mac-x64"]' || '["windows-x64","mac-arm64","mac-x64"]') }}
    runs-on: ${{ fromJSON('{"windows-x64":"windows-2025","mac-arm64":"macos-15","mac-x64":"macos-15-intel"}')[matrix.target] }}
    env:
      PACKAGE_OUTPUT: ${{ matrix.target == 'windows-x64' && 'release/beta' || 'release/macos' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install the native Electron runtime
        run: node node_modules/electron/install.js
      - run: pnpm test
      - run: pnpm run build
      - name: Prepare the native macOS graphics runtime
        if: runner.os == 'macOS'
        run: node scripts/prepare-macos-runtime.cjs
      - name: Package Windows
        if: runner.os == 'Windows'
        run: pnpm exec electron-builder --config electron-builder.beta.yml --win portable --x64 --publish never
      - name: Package macOS for the native architecture
        if: runner.os == 'macOS'
        run: pnpm exec electron-builder --config electron-builder.macos.yml --mac ${{ matrix.target == 'mac-arm64' && '--arm64' || '--x64' }} --publish never
      - name: Verify the packaged application and reminders
        run: node scripts/verify-release-bundle.cjs
      - name: Generate checksums
        run: node scripts/distribution-checksums.cjs
      - uses: actions/upload-artifact@v6
        with:
          name: beta-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            ${{ env.PACKAGE_OUTPUT }}/*.exe
            ${{ env.PACKAGE_OUTPUT }}/*.dmg
            ${{ env.PACKAGE_OUTPUT }}/*.zip
            ${{ env.PACKAGE_OUTPUT }}/SHA256SUMS-*.txt
