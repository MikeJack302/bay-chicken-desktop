<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src blob:"><title>湾湾 · 大湾鸡</title><link rel="stylesheet" href="style.css"></head><body class="pet-page">
<canvas id="pet-canvas" aria-label="三维大湾鸡，点击脑袋、头顶、眼睛、肚子、小手、脚丫、尾巴和后背，有不同的随机反应；拖动三维旋转，滚轮缩放，双击回正" tabindex="0"></canvas>

</div>
