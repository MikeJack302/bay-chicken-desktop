<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src blob:"><title>湾湾 · 大湾鸡</title><link rel="stylesheet" href="style.css"></head><body class="pet-page">
<canvas id="pet-canvas" aria-label="三维大湾鸡，点击脑袋、头顶、眼睛、肚子、小手、脚丫、尾巴和后背，有不同的随机反应；左键拖动移动，右键拖动旋转，滚轮缩放，双击回正" tabindex="0" title="左键拖动移动 · 右键拖动旋转 · 滚轮缩放 · F1 帮助"></canvas>
<div class="load-status" id="load-status" role="status">湾湾正在醒来…</div><div class="load-error" id="load-error" role="alert" data-interactive hidden><p id="error-message"></p><button id="retry-load">重新加载</button></div>
<div class="pet-bubble quiet" id="bubble">嗨，我是湾湾！今天也陪着你。</div>
<div id="sleepy" class="sleepy" hidden aria-hidden="true">z<span>z</span></div>
<div id="pet-dock" class="pet-dock" data-interactive hidden><nav class="pet-tools" aria-label="桌宠工具栏"><button id="move-pet" title="拖动搬家（或按住 Shift 拖动玩偶）" aria-label="拖动搬家"><i data-icon="move"></i></button><button data-action="pet" title="摸摸头" aria-label="摸摸头"><i data-icon="pet"></i></button><button id="reset-view" title="视角回正（双击玩偶）" aria-label="视角回正"><i data-icon="reset"></i></button><button id="more-actions" title="动作与设置" aria-label="动作与设置"><i data-icon="more"></i></button></nav>
<div class="pet-label"><span class="alive-dot"></span><span id="pet-name">湾湾</span> <span id="pet-state">站着陪你</span></div>
</div>
<script src="pet.js"></script></body></html>
